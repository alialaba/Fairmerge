# Netlify build settings. Netlify reads this file on every deploy, so the
# dashboard's build settings can stay empty.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires Node 22.23.4 or newer; this matches local development.
  NODE_VERSION = "24"
  # Playwright is only used locally (npm run export:hero); skip its browser download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Astro puts hashed CSS and JS in /_astro/. The file name changes whenever the
# content does, so browsers can cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
